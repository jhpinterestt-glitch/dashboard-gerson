<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0d0e12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-app-region: drag; /* Permite arrastar a janela de splash */
      user-select: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo {
      width: 180px;
      height: auto;
      margin-bottom: 24px;
      opacity: 0;
      transform: scale(0.95);
      animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .title {
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeIn 1s ease 0.2s forwards;
    }
    .spinner {
      width: 120px;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      border-radius: 4px;
    }
    .spinner-bar {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 40%;
      background-color: #c49e5d; /* Dourado champanhe da marca */
      border-radius: 4px;
      animation: loading 1.4s infinite ease-in-out;
    }
    @keyframes fadeInScale {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes fadeIn {
      to {
        opacity: 0.7;
      }
    }
    @keyframes loading {
      0% {
        left: -40%;
      }
      50% {
        left: 40%;
        width: 60%;
      }
      100% {
        left: 100%;
        width: 20%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="./gersonlogo.png" alt="Logo">
    <div class="title">Gerson Gomes Advocacia</div>
    <div class="spinner">
      <div class="spinner-bar"></div>
    </div>
  </div>
</body>
</html>
